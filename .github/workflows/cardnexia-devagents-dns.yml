# One-shot: create the DNS-only A records for this VM's DevAgents names.
# Removed after the records exist. Does not print the Cloudflare token.
name: cardnexia devagents DNS
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cardnexia-devagents-dns.yml
permissions: {}
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create DNS-only A records
        env:
          CF_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, urllib.error, urllib.request

          ip = "187.41.113.31"
          zones = ("subjectivetechnologies.com", "worktwins.com")
          tokens = [os.environ.get("CF_DNS_TOKEN", ""), os.environ.get("CF_API_TOKEN", "")]
          tokens = [token for token in tokens if token]
          if not tokens:
              raise SystemExit("Cloudflare token secret is empty")

          def call(token, method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = json.load(resp)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  # Drop anything that could echo the token.
                  detail = detail.replace(token, "<redacted>")[:400]
                  return exc.code, detail
              if not payload.get("success", True):
                  return 400, json.dumps(payload.get("errors"))[:400]
              return 200, payload

          last = "no token accepted"
          for index, token in enumerate(tokens, start=1):
              code, zone_payload = call(token, "GET", "/zones?name=subjectivetechnologies.com")
              if code != 200:
                  last = f"token {index} zone lookup HTTP {code}"
                  continue
              print(f"using token {index}")
              for zone in zones:
                  code, found = call(token, "GET", f"/zones?name={zone}")
                  if code != 200:
                      raise SystemExit(f"zone lookup failed for {zone}: HTTP {code} {found}")
                  result = found.get("result") or []
                  if not result:
                      raise SystemExit(f"zone not visible: {zone}")
                  zid = result[0]["id"]
                  name = f"cardnexia-devagents.{zone}"
                  code, existing = call(token, "GET", f"/zones/{zid}/dns_records?type=A&name={name}")
                  if code != 200:
                      raise SystemExit(f"record lookup failed for {name}: HTTP {code}")
                  body = {
                      "type": "A",
                      "name": name,
                      "content": ip,
                      "ttl": 1,
                      "proxied": False,
                      "comment": "DevAgents API :8080",
                  }
                  records = existing.get("result") or []
                  if records:
                      code, _ = call(token, "PUT", f"/zones/{zid}/dns_records/{records[0]['id']}", body)
                      action = "updated"
                  else:
                      code, _ = call(token, "POST", f"/zones/{zid}/dns_records", body)
                      action = "created"
                  if code != 200:
                      raise SystemExit(f"{action} {name} failed: HTTP {code}")
                  print(f"{action} {name} -> {ip} dns-only")
              raise SystemExit(0)
          raise SystemExit(last)
          PY
